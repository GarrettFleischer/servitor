syntax = "proto3";

package servitor.ledger.v1;

service Ledger {
    rpc PostEntry(PostEntryRequest) returns (Entry);
    rpc GetAccount(GetAccountRequest) returns (Account);
}

enum Side {
    SIDE_UNSPECIFIED = 0;
    DEBIT = 1;
    CREDIT = 2;
}

message Line {
    string account_id = 1;
    int64 amount_cents = 2;
    Side side = 3;
}

message PostEntryRequest {
  repeated Line lines = 1;
  // Empty string means unset (no reversal).
  string reverses_entry_id = 2;
}
message Entry {
  string id = 1;
  string tenant_id = 2;
  repeated Line lines = 3;
  string reverses_entry_id = 4;
  string created_at = 5; // RFC3339 from DB
}
message GetAccountRequest {
  string id = 1;
}
message Account {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string currency = 4;
  int64 posted_balance_cents = 5;
  string created_at = 6;
}