openapi: 3.1.0
info:
  title: Servitor Ledger API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Process up
  /readyz:
    get:
      security: []
      responses:
        "200":
          description: Postgres, Redis, and Redpanda reachable
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      security: []
      responses:
        "200":
          description: Prometheus text
  /v1/accounts:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Page of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "401":
          $ref: "#/components/responses/Error"
  /v1/accounts/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/accounts/{id}/entries:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/entries:
    post:
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEntryRequest"
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/entries/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    After:
      name: after
      in: query
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        currency:
          type: string
          enum: [USD]
          default: USD
    Account:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, currency, posted_balance_cents, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, enum: [USD] }
        posted_balance_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    AccountPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        next_after:
          type: string
          format: uuid
          nullable: true
    EntryLine:
      type: object
      additionalProperties: false
      required: [account_id, amount_cents, side]
      properties:
        account_id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        side: { type: string, enum: [debit, credit] }
    PostEntryRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/EntryLine" }
        reverses_entry_id:
          type: string
          format: uuid
          nullable: true
    Entry:
      type: object
      additionalProperties: false
      required: [id, tenant_id, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/EntryLine" }
        reverses_entry_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
    EntryPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        next_after:
          type: string
          format: uuid
          nullable: true